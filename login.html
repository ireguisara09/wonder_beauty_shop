<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonder Beauty Shop - Iniciar sesión</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="auth-header">
    <span class="logo-title" style="font-size:2.6rem;">WonderBeauty</span>
  </header>
<br><br><br><br><br>
  <div class="auth-wrapper">

    <div class="auth-illustration">
      <div class="flower-shape">
        <img class="logo-img" src="logo-wonderbeauty.png" alt="Wonder Beauty Shop - Tienda online de maquillaje">
      </div>
    </div>

    <div class="auth-card">
      <h2>Bienvenido a Wonder Beauty Shop</h2>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <p class="error-msg" id="login-error"></p>

        <div class="form-actions">
          <button type="submit" class="btn">Entrar</button>
          <span class="link-muted">¿Olvidaste tu contraseña? <a href="reset.html">Restablécela aquí</a></span>
        </div>
      </form>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
