<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonder Beauty Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body class="bg-light">

<header class="bg-info bg-opacity-25 text-center py-4">
  <h1 class="display-4 fw-bold text-primary">WonderBeauty</h1>
</header>

<main class="container py-5">
  <div class="row align-items-center justify-content-center g-5">

    <!-- Logo / marca -->
    <div class="col-12 col-md-6 text-center">
      <div class="rounded-circle bg-primary bg-opacity-25 border border-primary d-inline-flex flex-column align-items-center justify-content-center p-5" style="width:320px; height:320px;">
        <h2 class="fw-bold text-primary mb-0">Wonder</h2>
        <h2 class="fw-bold text-primary mb-1">Beauty</h2>
        <p class="fw-bold text-primary mb-1">SHOP</p>
        <small class="text-primary text-uppercase">Tienda online de maquillaje</small>
      </div>
    </div>

    <!-- Formulario de login -->
    <div class="col-12 col-md-5">
      <div class="card shadow border-0 rounded-3 p-4">
        <div class="card-body">
          <h3 class="card-title text-center fw-bold mb-4">Bienvenido a Wonder Beauty Shop</h3>
          <form>
            <div class="mb-3">
              <label for="correo" class="form-label fw-semibold">Correo Electronico</label>
              <input type="email" class="form-control rounded-pill" id="correo">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control rounded-pill" id="password">
            </div>
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-outline-primary rounded-pill px-4">Entrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</main>
   <script src="JS/script.js">
</body>
</html>
